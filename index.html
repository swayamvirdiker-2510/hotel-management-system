<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="desk">
    <div class="desk-inner">
      <span class="desk-mark">&#8962;</span>
      <div>
        <h1>The Fenwick Hotel</h1>
        <p class="desk-sub">Front desk &mdash; management console</p>
      </div>
    </div>
  </header>

  <main class="container">
    <nav class="menu">
      <button onclick="showAvailableRooms()"><span class="num">1</span>Display available rooms</button>
      <button onclick="handleAddCustomer()"><span class="num">2</span>Add customer</button>
      <button onclick="handleReservation()"><span class="num">3</span>Check / make reservation</button>
      <button onclick="handleCancelReservation()"><span class="num">4</span>Cancel reservation</button>
      <button onclick="showCustomerDetails()"><span class="num">5</span>Display customer details</button>
    </nav>

    <section id="outputArea">
      <p class="placeholder">Select an action above to see results here.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
